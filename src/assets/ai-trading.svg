<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="400" rx="10" fill="#F5F7FA" />
  
  <!-- Brain Circuit Background -->
  <circle cx="250" cy="200" r="150" fill="#E6F7FF" />
  
  <!-- Circuit Lines -->
  <path d="M150 200 L200 150 L250 200 L300 150 L350 200" stroke="#0F2847" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 8" />
  <path d="M150 250 L200 300 L250 250 L300 300 L350 250" stroke="#0F2847" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 8" />
  <path d="M250 100 L250 150 M250 250 L250 300" stroke="#0F2847" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 8" />
  <path d="M175 175 L225 225 M275 175 L325 225" stroke="#0F2847" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 8" />
  <path d="M175 225 L225 175 M275 225 L325 175" stroke="#0F2847" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 8" />
  
  <!-- Brain Outline -->
  <path d="M250 100 C290 100 330 120 350 150 C370 180 380 220 370 260 C360 300 330 330 290 340 C270 345 260 345 250 345 C240 345 230 345 210 340 C170 330 140 300 130 260 C120 220 130 180 150 150 C170 120 210 100 250 100Z" stroke="#0F2847" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Brain Divisions -->
  <path d="M250 100 L250 345" stroke="#0F2847" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M150 200 C180 180 220 170 250 170 C280 170 320 180 350 200" stroke="#0F2847" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M150 250 C180 270 220 280 250 280 C280 280 320 270 350 250" stroke="#0F2847" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Chart Line -->
  <path d="M180 230 L200 210 L220 240 L240 200 L260 220 L280 180 L300 210 L320 170" stroke="#00B4D8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Nodes -->
  <circle cx="200" cy="210" r="6" fill="#00D4FF" />
  <circle cx="240" cy="200" r="6" fill="#00D4FF" />
  <circle cx="280" cy="180" r="6" fill="#00D4FF" />
  <circle cx="320" cy="170" r="6" fill="#00D4FF" />
  
  <!-- Pulse Animation Rings -->
  <circle cx="250" cy="200" r="30" stroke="#00B4D8" stroke-width="2" fill="none" opacity="0.6" />
  <circle cx="250" cy="200" r="60" stroke="#00B4D8" stroke-width="2" fill="none" opacity="0.4" />
  <circle cx="250" cy="200" r="90" stroke="#00B4D8" stroke-width="2" fill="none" opacity="0.2" />
</svg>